name: Bug report
description: Tell us about something in nom that is not working as expected.
title: "[Bug]: "
labels: [bug, "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. A small, reproducible example is the fastest way to get to a fix.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the unexpected behavior and why you believe it is a bug.
      placeholder: I expected ... but instead ...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Give us the smallest set of steps or a repository that reliably reproduces the problem.
      placeholder: |
        1. Install ...
        2. Configure ...
        3. Call ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: error-output
    attributes:
      label: Error output or screenshots
      description: Paste relevant logs, stack traces, or screenshots. Please remove sensitive information.
      render: shell
  - type: input
    id: sdk-version
    attributes:
      label: nom version
      description: Which version of @nom-ai/sdk are you using?
      placeholder: 0.1.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the OS, runtime and version (for example, macOS 15, Bun 1.3.14, Next.js 16.1).
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I have removed secrets and private data from this report.
          required: true
