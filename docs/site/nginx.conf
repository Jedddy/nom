server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Traefik terminates TLS and forwards plain HTTP, so nginx cannot know the original
    # scheme. Absolute redirects would emit http:// for an https:// request and downgrade
    # the connection. Relative Location headers preserve whatever the client used.
    absolute_redirect off;

    # The export is directory-style (`trailingSlash` in next.config.ts), so the default
    # index resolution handles routes; nginx redirects the no-slash form on its own.

    error_page 404 /404.html;

    # Build assets are content-hashed, so they can be cached indefinitely.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
